name: Process Podcast Queue and Deploy

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: "podcast-queue"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests beautifulsoup4 edge-tts google-genai mutagen trafilatura pypdf

      - name: Run batch process
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python batch_process.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f update_feed.py ]; then
            python update_feed.py
          fi
          
          # 1. コミットする前に、リモートの最新状態を強制優先（-X theirs）で安全に取り込む
          git fetch origin main
          git pull --rebase -X theirs origin main || true

          # 2. 変更を追加してコミット
          git add -A
          if git diff --staged --quiet; then
            echo "変更はありません。"
          else
            git commit -m "Update feed and audio files"
            
            # 3. プッシュ（もしこの間に別の更新が入って弾かれても、自動で一度引っ張ってから再プッシュする）
            git push origin main || (git pull --rebase -X theirs origin main && git push origin main)
          fi
