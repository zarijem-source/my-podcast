name: Process Podcast Queue and Deploy

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: "podcast-queue"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests beautifulsoup4 edge-tts google-genai mutagen trafilatura pypdf

      - name: Run batch process
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python batch_process.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f update_feed.py ]; then
            python update_feed.py
          fi
          
          # 1. 常に最新のリモート状態をフェッチしておく
          git fetch origin main
          
          # 2. 万が一、手元のファイルがリモートとズレていたら、リモートの変更を強制優先してマージする設定にする
          git config merge.conflictstyle diff3
          git checkout -f origin/main || true
          
          # （もし batch_process.py や update_feed.py で生成されたファイル群を再度ステージングする）
          # ※ここでは一度最新にした上で、今回の成果物を上乗せします
          if [ -f update_feed.py ]; then
            python update_feed.py
          fi

          git add -A
          if git diff --staged --quiet; then
            echo "変更はありません。"
          else
            git commit -m "Update feed and audio files"
            
            # 3. プッシュ前に再度最新を pull（--no-rebase を強制し、衝突時はリモートを --theirs で完全優先）
            git pull --no-rebase -X theirs origin main || true
            git push origin main
          fi
