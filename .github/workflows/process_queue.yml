name: Process Podcast Queue from Issues

on:
  issues:
    types: [opened]
  workflow_dispatch:

concurrency:
  group: podcast-batch-queue
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  batch-generate:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: システムパッケージ（ffmpeg）のインストール
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 依存Pythonライブラリのインストール
        run: |
          pip install google-genai trafilatura edge-tts beautifulsoup4 pypdf requests

      - name: Issueキューの一括処理
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python batch_process.py

      - name: フィード更新と一括コミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f update_feed.py ]; then
            python update_feed.py
          fi

          git add *.m4a *.title feed.xml

          if git diff --staged --quiet; then
            echo "追加された音声はありません。"
            exit 0
          fi

          git commit -m "Batch add episodes via Issue queue [skip ci]"

          for i in {1..3}; do
            if git push origin main; then
              echo "プッシュ成功"
              break
            fi
            git fetch origin main
            git reset --soft origin/main
            if [ -f update_feed.py ]; then
              python update_feed.py
            fi
            git add *.m4a *.title feed.xml
            git commit -m "Batch add episodes via Issue queue [skip ci]"
          done
