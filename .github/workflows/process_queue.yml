name: Process Podcast Queue and Deploy

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: "podcast-queue"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests beautifulsoup4 edge-tts google-genai mutagen trafilatura pypdf

      - name: Run batch process
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python batch_process.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f update_feed.py ]; then
            python update_feed.py
          fi
          
          # 1. ここが決定打：rebaseを一切やめ、リモートの最新状態を強制的に取得して手元を完全に同期する
          git fetch origin main
          git reset --hard origin/main
          
          # 2. 同期した上で、今回の音声生成やfeed更新スクリプトをもう一度走らせて最新の成果物を作る
          if [ -f update_feed.py ]; then
            python update_feed.py
          fi
          # （※ batch_process.py で生成された新しい音声ファイルや更新された feed.xml をここで確実に対象にする）

          git add -A
          if git diff --staged --quiet; then
            echo "変更はありません。"
          else
            git commit -m "Update feed and audio files"
            
            # 3. 最後に強制プッシュ（万が一の時もリモートを正とする）
            git push origin main --force-with-lease
          fi
